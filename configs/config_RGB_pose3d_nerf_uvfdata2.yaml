seed: 0
wandb_project: 'inr_nerf_rgb_pose3d_uvfdata2'

MODEL:
  model_name: 'inr_nerf_rgb'  # 基于原始NeRF架构的模型
  in_dim: 3  # 3D坐标（包含pose信息）
  out_dim: 1  # 灰度图，set to 3 if RGB
  decoder_hidden_dim: 128  # MLP隐藏层维度（NeRF默认256）
  decoder_n_hidden_layers: 8  # MLP层数（NeRF默认8层）
  decoder_input_encoding: 'PE'  # 使用位置编码（NeRF标准）
  decoder_nl: 'relu'  # 使用ReLU激活函数（NeRF标准）
  decoder_init_type: 'normal'  # 使用Kaiming Normal初始化（适合ReLU）
  outermost_linear: True
  decoder_init_r: 0.1
  decoder_freqs: 1.0  # 位置编码频率数量（NeRF默认10个频率）
  pe_num_freqs: 1  # 位置编码频率数量（2^0 到 2^9）
  pe_linear_freqs: False  # 使用指数频率（NeRF风格）
  decoder_trainable_freqs: False
  sphere_init_params: [1.6, 0.1]
  planar_init_params: {'centroids': null, 'normals': null, 'idx': null, 'dim': null}
  use_hashtable: False
  aux_type: 'img'

LOSS:
  div_metric_type: 'l1'
  normal_metric_type: 'cos'
  eikonal_metric_type: 'l1'
  appxsdf_metric_type: 'l2'
  div_clamp: 50
  sdf_clamp: 1.0
  div_decay_type: 'linear'
  div_decay_params: [ 100, 0.2, 100, 0.4, 0.0, 0.0 ]
  scale_by_q_grad: False
  loss_type: '1000rgbrecon'  # 重建损失权重100
  sample_bias_correction: False
  appxsdf_threshold: 0.01
  entropy_metric: 'kl'
  segmentation_type: 'both'
  rgbrecon_metric: 'l2'

DATA:
  dataset_path: './MyMoE/LH_Par_C_DtP2'  # 数据路径uvfdata2
  pose_file: './MyMoE/coords3d/LH_Par_C_DtP2.xlsx'  # 位姿文件uvfdata2
  downsample_factor: 1
  segmentation_type: 'none'
  grid_patch_size: 1
  kmeansspace: 'rgb'
  n_segments: 1
  get_dino: False
  copy_to_gpu: False
  angles_in_degrees: true  # 角度单位
  use_global_norm: true  # 使用全局归一化
  crop_size: null  # 保持640×480完整分辨率，不裁剪
  use_uvfdata2_calibration: true  # 使用uvfdata2标定矩阵（S和C矩阵）

TRAINING:
  lr: 5.0e-4  # NeRF默认学习率（稍高一些）
  lr_gamma: 0.999  # 每个epoch下降到原来的0.999倍
  lr_step_size: 10  # 每10个epoch下降一次
  lr_scheduler: 'StepLR'  # 使用StepLR调度器
  num_epochs: 400  # 训练轮数
  batch_size: 1
  num_workers: 0
  grad_clip_norm: 1.0  # 梯度裁剪
  manager_freeze_fraction: 0.0
  save_reconstructed_imgs: False
  stages: [
           {'end_iteration_frac': 1.0, 'params':'all', 'loss_type': '100rgbrecon'},
          ]

