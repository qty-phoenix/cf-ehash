seed: 0
wandb_project: 'inr_moe_rgb_pose3d_uvfdata2'

MODEL:
  model_name: 'inr_moe_rgb'
  in_dim: 3
  out_dim: 1 # 灰度图像，如果是RGB则设为3
  decoder_hidden_dim: 128
  decoder_n_hidden_layers: 2
  decoder_input_encoding: 'HE'  # 改为哈希编码 (Hash Encoding)
  decoder_nl: 'sine'
  decoder_init_type: 'siren'
  n_experts: 4
  outermost_linear: True
  decoder_init_r: 0.5
  decoder_pt_path: null
  decoder_freqs: 10.
  decoder_trainable_freqs: False
  top_k: 1
  
  # 哈希编码参数（Expert网络）
  hash_n_levels: 16  # 层级数
  hash_n_features_per_level: 2  # 每层特征数
  hash_log2_hashmap_size: 19  # 哈希表大小 (2^19≈52万)
  hash_base_resolution: 16  # 最粗分辨率
  hash_finest_resolution: 2048  # 最精细分辨率 (匹配640×480)

  # Manager网络配置
  manager_hidden_dim: 128
  manager_n_hidden_layers: 2
  manager_input_encoding: 'learned_128_2_sine_siren_none'  # Manager保持Position Encoding
  pe_linear_freqs: false  # 使用线性频率（true=线性，false或不设置=指数频率NeRF风格）
  manager_nl: 'sine'
  manager_init: 'siren'
  centroid_type: 'random'
  manager_type: 'standard'
  manager_bias: 'none'
  experts_bias_std: 0.1
  experts_bias_weight: 1.0
  manager_softmax_temperature: 0.1
  manager_softmax_temp_trainable: True
  manager_use_lipschitz: False
  manager_q_activation: 'softmax'
  manager_clamp_q: 0.0
  manager_conditioning: 'cat'  # 使用连接条件化，将专家编码特征传递给管理器
  manager_mixing: False
  manager_do: False
  load_pt_manager: False
  shared_encoder: False
  gaussian_std: 0.05
  prob_std: 0.2
  manager_gt_input_sanitycheck: False
  manager_aux_branch_hidden_dim: 1
  grid_patch_size: 4096

  encoder_type: 'none'
  encoder_hidden_dim: 8
  latent_size: 0
  sphere_init_params: [1.6, 0.1]
  planar_init_params: {'centroids': null, 'normals': null, 'idx': null, 'dim': null}
  use_hashtable: False
  aux_type: 'img'

LOSS:
  div_metric_type: 'l1'
  normal_metric_type: 'cos'
  eikonal_metric_type: 'l1'
  appxsdf_metric_type: 'l2'
  div_clamp: 50
  sdf_clamp: 1.0
  div_decay_type: 'linear'
  div_decay_params: [ 100, 0.2, 100, 0.4, 0.0, 0.0 ]
  scale_by_q_grad: False
  loss_type: '100rgbrecon+0.1balance'  # 移除了+0.5qentropy，因为gradient_fixed.py和hash_multi_expert.py不支持qentropy
  # 如果需要使用qentropy，请使用moe.py训练脚本
  sample_bias_correction: False
  appxsdf_threshold: 0.01
  entropy_metric: 'kl'
  segmentation_type: 'both'
  rgbrecon_metric: 'l2'

DATA:
  name: 'RGBPOSE3D'
  dataset_path: './MyMoE/uvfdata2'  # 修改为数据路径2LH_Par_C_DtP2
  pose_file: './MyMoE/coords3d/uvfdata2.xlsx'  # 修改为位姿文件2LH_Par_C_DtP2
  downsample_factor: 1
  segmentation_type: 'none'
  grid_patch_size: 1
  kmeansspace: 'rgb'
  n_segments: 1
  get_dino: False
  copy_to_gpu: False
  angles_in_degrees: true  # 角度单位
  use_global_norm: true  # 使用全局归一化
  crop_size: null  # 不裁剪，使用原始640x480分辨率
  use_uvfdata2_calibration: true  # 使用uvfdata2标定矩阵（S和C矩阵）

TRAINING:
#  n_points: 10000
#  nonmnfld_sample_type: 'combined'
#  grid_res: 160
  lr: 1.0e-4
  lr_gamma: 0.999  # 每个epoch下降到原来的0.999倍
  lr_step_size: 10  # 每10个epoch下降一次
  lr_scheduler: 'StepLR'
  num_epochs: 400
  batch_size: 1
  num_workers: 0
#  refine_epoch: 0
  grad_clip_norm: 1.0
#  normalize_normal_loss: False
#  unsigned_n: True
#  unsigned_d: False
#  export_vis: False
  manager_freeze_fraction: 0.0
#  n_loss_type: 'cos'
#  inter_loss_type: 'exp'
#  sampler_prob: 'none'
#  refine_q_boundaries: False
#  refine_q_boundaries_every: 10
  save_reconstructed_imgs: False
  # stages配置已注释，因为gradient_fixed.py和hash_multi_expert.py不使用分阶段训练
  # 如果需要使用stages，请使用moe.py训练脚本
  stages: [
            {'end_iteration_frac': 1.0, 'params':'all', 'loss_type': '100rgbrecon+0.1balance'},
           ]

