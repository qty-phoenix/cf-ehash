seed: 0
wandb_project: 'inr_ultranerf_LH_Par_C_DtP2'

MODEL:
  model_name: 'inr_ultranerf_rgb'
  in_dim: 3
  out_dim: 1

  decoder_hidden_dim: 128
  decoder_n_hidden_layers: 8
  decoder_nl: 'relu'
  decoder_input_encoding: 'PE'
  pe_num_freqs: 10
  pe_linear_freqs: false
  decoder_init_type: 'normal'
  outermost_linear: true
  decoder_init_r: 0.5

  n_experts: 1
  top_k: 1

  manager_hidden_dim: 128
  manager_n_hidden_layers: 2
  manager_input_encoding: 'learned_128_2_sine_siren_none'
  manager_nl: 'sine'
  manager_init: 'siren'
  centroid_type: 'random'
  manager_type: 'standard'
  manager_bias: 'none'
  experts_bias_std: 0.1
  experts_bias_weight: 1.0
  manager_softmax_temperature: 0.1
  manager_softmax_temp_trainable: False
  manager_use_lipschitz: False
  manager_q_activation: 'softmax'
  manager_clamp_q: 0.0
  manager_conditioning: 'cat'
  manager_mixing: False
  manager_do: False
  load_pt_manager: False
  shared_encoder: False
  gaussian_std: 0.05
  prob_std: 0.2
  manager_gt_input_sanitycheck: False
  manager_aux_branch_hidden_dim: 1
  grid_patch_size: 4096

  encoder_type: 'none'
  encoder_hidden_dim: 8
  latent_size: 0
  use_hashtable: False

LOSS:
  div_metric_type: 'l1'
  normal_metric_type: 'cos'
  eikonal_metric_type: 'l1'
  appxsdf_metric_type: 'l2'
  div_clamp: 50
  sdf_clamp: 1.0
  div_decay_type: 'linear'
  div_decay_params: [100, 0.2, 100, 0.4, 0.0, 0.0]
  scale_by_q_grad: False
  loss_type: '100rgbrecon+0.1balance'
  sample_bias_correction: False
  appxsdf_threshold: 0.01
  entropy_metric: 'kl'
  segmentation_type: 'both'
  rgbrecon_metric: 'l2'

DATA:
  name: 'RGBPOSE3D'
  dataset_path: './MyMoE/LH_Par_C_DtP2'
  pose_file: './MyMoE/coords3d/LH_Par_C_DtP2.xlsx'
  downsample_factor: 1
  segmentation_type: 'none'
  grid_patch_size: 1
  kmeansspace: 'rgb'
  n_segments: 1
  get_dino: False
  copy_to_gpu: False
  angles_in_degrees: false
  use_global_norm: true
  crop_size: null
  use_uvfdata2_calibration: false

TRAINING:
  lr: 1.0e-4
  lr_gamma: 0.999
  lr_step_size: 10
  lr_scheduler: 'StepLR'
  num_epochs: 500
  batch_size: 1
  num_workers: 0
  grad_clip_norm: 1.0
  manager_freeze_fraction: 0.0
  save_reconstructed_imgs: False
  stages:
    - {end_iteration_frac: 1.0, params: 'all', loss_type: '100rgbrecon+0.1balance'}
