seed: 0
wandb_project: 'inr_moe_rgb_pose3d_hash_multi_expert_uvfdata2'

MODEL:
  model_name: 'inr_moe_hashhybrid_rgb'  # 多专家混合哈希编码模型
  in_dim: 3  # 3D坐标（包含pose信息）
  out_dim: 1  # 灰度图，set to 3 if RGB
  decoder_hidden_dim: 32  # 解码器隐藏层维度
  decoder_n_hidden_layers: 2  # 解码器层数
  decoder_input_encoding: 'HE_MoE'  # 使用多专家混合哈希编码（HE_MoE）
  decoder_nl: 'sine'  # 使用SIREN激活函数sine
  decoder_init_type: 'siren'  # SIREN专用初始化siren
  n_experts: 4  # 4个专家
  outermost_linear: True
  decoder_init_r: 0.5
  decoder_pt_path: null
  decoder_freqs: 10.0
  decoder_trainable_freqs: False
  top_k: 1  # 每次选择top-2专家
  
  # 多专家混合哈希编码参数配置
  # 前6层共用，后6层使用多专家路由（每个专家有独立的6层哈希表）
  hash_n_levels: 16  # 总共12层
  hash_shared_levels: 10  # 前6层共享，后6层多专家
  hash_n_features_per_level: 2  # 每层特征数
  hash_log2_hashmap_size: 19  # 哈希表大小 2^19 ≈ 52万（匹配640×480分辨率）
  hash_base_resolution: 16  # 最粗糙分辨率
  hash_finest_resolution: 2048  # 最精细分辨率（匹配640×480分辨率）

  # Manager网络配置（只使用PE编码，不拼接专家特征）
  manager_hidden_dim: 128  # Manager隐藏层维度
  manager_n_hidden_layers: 2  # Manager层数
  manager_input_encoding: 'PE'  # Manager使用位置编码
  manager_nl: 'sine'  # 使用SIREN激活函数
  manager_init: 'siren'  # SIREN专用初始化
  centroid_type: 'random'
  manager_type: 'standard'
  manager_bias: 'none'
  experts_bias_std: 0.1
  experts_bias_weight: 1.0
  manager_softmax_temperature: 0.1  # uvfdata2版本使用更低的温度
  manager_softmax_temp_trainable: True  # 允许温度可训练
  # Auxiliary-Loss-Free Load Balancing (论文方法)
  use_expert_bias_for_load_balancing: true  # 设置为true启用专家偏置负载均衡
  expert_bias_update_rate: 0.01  # 偏置更新率（如果启用上述选项）
  manager_use_lipschitz: False
  manager_q_activation: 'softmax'
  manager_clamp_q: 0.0
  manager_conditioning: 'cat'  # 拼接前6层共享哈希编码特征
  manager_mixing: False
  manager_do: False
  load_pt_manager: False
  shared_encoder: False
  gaussian_std: 0.05
  prob_std: 0.2
  manager_gt_input_sanitycheck: False
  manager_aux_branch_hidden_dim: 1
  grid_patch_size: 4096

  encoder_type: 'none'
  encoder_hidden_dim: 8
  latent_size: 0
  sphere_init_params: [1.6, 0.1]
  planar_init_params: {'centroids': null, 'normals': null, 'idx': null, 'dim': null}
  use_hashtable: False
  aux_type: 'img'

LOSS:
  div_metric_type: 'l1'
  normal_metric_type: 'cos'
  eikonal_metric_type: 'l1'
  appxsdf_metric_type: 'l2'
  div_clamp: 50
  sdf_clamp: 1.0
  div_decay_type: 'linear'
  div_decay_params: [ 100, 0.2, 100, 0.4, 0.0, 0.0 ]
  scale_by_q_grad: False
  loss_type: '1000rgbrecon'  # 重建损失权重100 + 平衡损失0.1+0.1balance
  sample_bias_correction: False
  appxsdf_threshold: 0.01
  entropy_metric: 'kl'
  segmentation_type: 'both'
  rgbrecon_metric: 'l2'

DATA:
#  name: 'RGBPOSE3D'
  dataset_path: './MyMoE/uvfdata2'  # 数据路径uvfdata22LH_Par_C_DtP2
  pose_file: './MyMoE/coords3d/uvfdata2.xlsx'  # 位姿文件uvfdata22LH_Par_C_DtP2
  downsample_factor: 1
  segmentation_type: 'none'
  grid_patch_size: 1
  kmeansspace: 'rgb'
  n_segments: 1
  get_dino: False
  copy_to_gpu: False
  angles_in_degrees: true  # 角度单位
  use_global_norm: true  # 使用全局归一化
  crop_size: null  # 保持640×480完整分辨率，不裁剪
  use_uvfdata2_calibration: true  # 使用uvfdata2标定矩阵（S和C矩阵）

TRAINING:
#  n_points: 10000
#  nonmnfld_sample_type: 'combined'非流形点用不到
#  grid_res: 160  # 匹配图像分辨率 SDF任务专用配置项
  lr: 1.0e-4  # 基础学习率
  lr_gamma: 0.999  # 下降到原来的0.999倍
  lr_step_size: 10  # 每10个epoch下降一次
  lr_scheduler: 'StepLR'  # 使用StepLR调度器
  num_epochs: 1000  # 训练轮数（uvfdata2版本使用更多epoch）
  batch_size: 1
  num_workers: 0
#  refine_epoch: 0
  grad_clip_norm: 1.0  # 梯度裁剪
#  normalize_normal_loss: False   SDF任务专用
#  unsigned_n: True
#  unsigned_d: False
#  export_vis: False
  manager_freeze_fraction: 0.0
#  n_loss_type: 'cos'
#  inter_loss_type: 'exp'
#  sampler_prob: 'none'
#  refine_q_boundaries: False
#  refine_q_boundaries_every: 10   未实现但看起来有用
  save_reconstructed_imgs: False
  stages: [
           {'end_iteration_frac': 1.0, 'params':'all', 'loss_type': '100rgbrecon'},
          ]

